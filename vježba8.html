<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Vježba 8</title>
	<style>
		body{
			font-family: Arial;
			background-color: lightseagreen;
			padding: 40px;
		}
		h1 {
			margin-bottom: 20px;
		}
		.pet-img {
			width: 500px;
			display: block;
			margin-bottom: 20px;
			transition: transform 0.3s ease;
		}
		.pet-img:hover {
			transform: scale(1.1);
		}
		.pet-button{
			padding: 15px 25px;
			background-color: sienna;
			color: white;
			border: none;
			cursor: pointer;
			font-size: 16px;
			transition: background-color
			0.3s ease, transform 0.3s ease;
		}
		.pet-button:hover {
			background-color: peru;
			transform: scale(1.1);
		}
		.pet-button:active {transform: scale(0.95);
		}
		.pet-input {
			display: block;
			margin-top: 20px;
			padding: 10px;
			font-size: 16px;
			border: 2px solid black;
			transition: border-color 0.3s ease, transform 0.3s ease;
		}
		.pet-input:focus {
			border-color: darkblue;
			outline: none;
			transform: scale(1.05);
		}

	</style>
</head>
<body>
	<h1>Kućni ljubimci</h1>
	<img src="pas.jpg" alt="pas" class="pet-img">
	<button class="pet-button">Klikni gumb!</button>
	<input type="text" placeholder="Ime ljubimca" class="pet-input">

</body>
</html>
